name: Website quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build production website
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start production server
        run: npm start > /tmp/comwerkz-next.log 2>&1 &

      - name: Wait for production server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/comwerkz-next.log
          exit 1

      - name: Verify response security headers
        run: npm run security:headers

      - name: Install Chromium for responsive checks
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile end-to-end checks
        run: npm run test:e2e
